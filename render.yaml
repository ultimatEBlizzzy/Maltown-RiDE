# Render Blueprint for a no-cost preview deployment.
# Free PostgreSQL expires 30 days after creation; do not use for important data.
services:
  - type: web
    name: maltown-ride
    runtime: node
    region: singapore
    plan: free
    buildCommand: npm ci --include=dev && npm run db:migrate && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: maltown-ride-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: FARE_BASE
        value: 15
      - key: FARE_PER_KM
        value: 6
      - key: FARE_PER_MIN
        value: 0.8
      - key: FARE_BOOKING_FEE
        value: 5
      - key: FARE_MIN
        value: 25
      - key: MATCH_RADIUS_KM
        value: 15

databases:
  - name: maltown-ride-db
    databaseName: maltown_ride
    user: maltown_ride
    region: singapore
    plan: free
    postgresMajorVersion: "16"